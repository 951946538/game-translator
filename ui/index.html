<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>游戏实时翻译</title>
<style>
  :root {
    --bg: #14141f; --panel: rgba(30,30,46,.85); --input: #313244;
    --input-hover: #45475a; --text: #cdd6f4; --text-dim: #6c7086;
    --accent: #89b4fa; --purple: #cba6f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(400px 240px at 90% -10%, rgba(137,180,250,.14), transparent),
      radial-gradient(360px 200px at -10% 110%, rgba(203,166,247,.10), transparent);
  }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 14px 8px; user-select: none;
  }
  .logo {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: bold; color: #fff;
    box-shadow: 0 4px 14px rgba(124,58,237,.4);
  }
  header h1 { font-size: 14px; font-weight: 600; }
  .spacer { flex: 1; }
  .icon-btn {
    border: none; background: var(--input); color: var(--text);
    width: 28px; height: 28px; border-radius: 8px; cursor: pointer;
    font-size: 13px; transition: background .15s;
  }
  .icon-btn:hover { background: var(--input-hover); }
  .icon-btn.close:hover { background: #e5484d; color: #fff; }

  main { flex: 1; display: flex; flex-direction: column; padding: 0 14px 14px; min-height: 0; }
  .stage-card {
    background: var(--panel); border: 1px solid rgba(255,255,255,.06);
    border-radius: 14px; padding: 18px 14px; text-align: center;
  }
  .stage-text {
    font-size: 15px; font-weight: 600; line-height: 1.5; white-space: pre-line;
    color: var(--accent); transition: color .3s;
  }
  .stage-text.success { color: var(--green, #a6e3a1); }
  .stage-text.warn { color: #e0af68; }
  .status-line {
    margin-top: 10px; font-size: 10.5px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 10px;
    font-size: 11px; padding: 3px 10px; border-radius: 999px;
    background: var(--input); color: var(--text-dim);
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
  .badge.on .dot { background: #a6e3a1; animation: pulse 2s infinite; }
  .badge.paused .dot { background: #e0af68; }
  @keyframes pulse { 50% { opacity: .35; } }

  .btn-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    margin-top: 12px;
  }
  button { font-family: inherit; cursor: pointer; transition: all .15s; }
  .btn {
    border: none; border-radius: 10px; padding: 11px 6px; position: relative;
    background: var(--input); color: var(--text); font-size: 12.5px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .btn:hover { background: var(--input-hover); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn .k { font-size: 9px; color: var(--text-dim); }
  .btn.primary { background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; }
  .btn.green { background: linear-gradient(135deg, #2d6a4f, #40916c); color: #fff; }
  .btn.purple { background: linear-gradient(135deg, #7c3aed, #8b5cf6); color: #fff; }
  .btn.primary:hover, .btn.green:hover, .btn.purple:hover { filter: brightness(1.15); }
  .btn .red-dot {
    position: absolute; top: 7px; right: 9px; width: 8px; height: 8px;
    border-radius: 50%; background: #f38ba8; display: none;
    animation: pulse 1.2s infinite;
  }
  .btn.has-new .red-dot { display: block; }

  /* 模态 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 99;
    backdrop-filter: blur(3px);
  }
  .modal-mask.show { display: flex; }
  .modal {
    width: 300px; max-width: 92vw; background: #1e1e2e;
    border: 1px solid rgba(255,255,255,.08); border-radius: 14px;
    padding: 20px; animation: mIn .25s ease;
  }
  @keyframes mIn { from { opacity: 0; transform: translateY(-8px); } }
  .modal h2 { font-size: 14px; color: var(--accent); margin-bottom: 6px; }
  .modal .desc { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; line-height: 1.6; }
  .modal a.link { display: block; font-size: 11.5px; color: var(--accent); cursor: pointer; margin-bottom: 8px; }
  .modal label { display: block; font-size: 11.5px; margin: 8px 0 4px; }
  .modal input {
    width: 100%; background: var(--input); border: 1px solid transparent;
    border-radius: 8px; padding: 9px 10px; color: var(--text);
    font-size: 12.5px; font-family: inherit; outline: none;
  }
  .modal input:focus { border-color: #3b82f6; }
  .modal .row { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  .modal .btn-text {
    border: none; background: var(--input); color: var(--text);
    border-radius: 8px; padding: 8px 14px; font-size: 12px;
  }
  .modal .btn-main {
    border: none; border-radius: 8px; padding: 8px 18px; font-size: 12px; font-weight: 600;
    background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff;
  }
  .help-body { font-size: 12px; line-height: 1.9; }
  .help-body b { color: var(--accent); }
  .toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: var(--input); color: var(--text); font-size: 12px;
    padding: 8px 16px; border-radius: 999px; z-index: 100;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header id="titlebar">
  <div class="logo">译</div>
  <h1>游戏实时翻译</h1>
  <div class="spacer"></div>
  <button class="icon-btn" title="API 设置" onclick="openSettings()">🔑</button>
  <button class="icon-btn" title="使用说明" onclick="openHelp()">?</button>
  <button class="icon-btn" title="最小化" onclick="pywebview.api.minimize_window()">—</button>
  <button class="icon-btn close" title="关闭" onclick="winClose()">✕</button>
</header>

<main>
  <div class="stage-card">
    <div class="stage-text" id="stageText">等待选择区域
按 F7 捕获游戏窗口</div>
    <div class="status-line" id="statusLine"></div>
    <div class="badge" id="badge"><span class="dot"></span><span id="badgeText">未监控</span></div>
  </div>

  <div class="btn-grid">
    <button class="btn purple" onclick="py('f5')">截图直译<span class="k">F5</span></button>
    <button class="btn green" onclick="py('f6')">立即翻译<span class="k">F6</span></button>
    <button class="btn primary" onclick="py('f7')">游戏窗口<span class="k">F7</span></button>
    <button class="btn" onclick="py('f9')">暂停翻译<span class="k">F9</span></button>
    <button class="btn" id="outputBtn" onclick="openOutput()">
      输出面板<span class="red-dot"></span>
    </button>
    <button class="btn" onclick="py('f11')">显示切换<span class="k">F11</span></button>
  </div>
</main>

<!-- API 设置模态 -->
<div class="modal-mask" id="settingsMask">
  <div class="modal">
    <h2>配置 DeepSeek API</h2>
    <div class="desc">密钥仅保存在本机 Windows 凭据管理器，不写入任何文件。</div>
    <a class="link" onclick="pywebview.api.open_url('https://platform.deepseek.com/api_keys')">① 打开 DeepSeek 平台创建密钥 →</a>
    <label>API 地址（OpenAI 兼容）</label>
    <input id="setUrl" placeholder="https://api.deepseek.com/v1">
    <label>API 密钥</label>
    <input id="setKey" type="password" placeholder="sk-...">
    <div class="row">
      <button class="btn-text" onclick="closeModal('settingsMask')">取消</button>
      <button class="btn-main" onclick="saveKey()">保存</button>
    </div>
  </div>
</div>

<!-- 帮助模态 -->
<div class="modal-mask" id="helpMask">
  <div class="modal">
    <h2>使用说明</h2>
    <div class="help-body">
      <b>快速上手</b><br>
      1. 🔑 填入自己的 DeepSeek 密钥<br>
      2. 点击游戏画面，按 <b>F7</b> 捕获游戏窗口<br>
      3. <b>F6</b> 立即翻译 · <b>F5</b> 截图直译<br>
      4. 「输出面板」看历史与 AI 对话<br><br>
      <b>热键</b>：F5 直译 | F6 翻译 | F7 窗口 | F9 暂停 | F11 显示模式
    </div>
    <div class="row">
      <button class="btn-main" onclick="closeModal('helpMask')">知道了</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- Python → JS 事件 ----------
  window.__pyEvents = function(events) {
    for (const [kind, data] of events) {
      if (kind === "stage") setStage(data.text, data.tone);
      else if (kind === "state") applyState(data);
      // 新输出红点（详细内容显示在输出面板窗口）
      else if (kind === "vision_start" || kind === "translation") {
        if (!outputOpen) document.getElementById("outputBtn").classList.add("has-new");
      }
      else if (kind === "output_state") {
        outputOpen = data.open;
        if (data.open) document.getElementById("outputBtn").classList.remove("has-new");
      }
    }
  };
  let outputOpen = false;

  // ---------- 动作 ----------
  function py(name) { pywebview.api.action(name); }
  function openOutput() {
    document.getElementById("outputBtn").classList.remove("has-new");
    pywebview.api.toggle_output();
  }

  // ---------- 状态 ----------
  function setStage(text, tone) {
    const el = document.getElementById("stageText");
    el.textContent = text;
    el.className = "stage-text" + (tone ? " " + tone : "");
  }
  function applyState(s) {
    if (s.status !== undefined) document.getElementById("statusLine").textContent = s.status || "";
    if (s.paused !== undefined || s.region !== undefined) {
      const hasRegion = !!s.region;
      document.getElementById("badge").className =
        "badge " + (hasRegion ? (s.paused ? "paused" : "on") : "");
      document.getElementById("badgeText").textContent =
        !hasRegion ? "未监控" : (s.paused ? "已暂停" : "监控中");
    }
  }

  // ---------- 模态 ----------
  function openSettings() {
    pywebview.api.get_state().then(s => {
      document.getElementById("setUrl").value = s.base_url || "";
      document.getElementById("setKey").value = "";
    });
    document.getElementById("settingsMask").classList.add("show");
  }
  function openHelp() { document.getElementById("helpMask").classList.add("show"); }
  function closeModal(id) { document.getElementById(id).classList.remove("show"); }
  function saveKey() {
    const url = document.getElementById("setUrl").value.trim();
    const key = document.getElementById("setKey").value.trim();
    pywebview.api.save_api_key(url, key).then(r => {
      if (r.ok) { toast("密钥已保存 ✓"); closeModal("settingsMask"); }
      else toast(r.msg);
    });
  }
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }
  document.querySelectorAll(".modal-mask").forEach(m =>
    m.addEventListener("click", e => { if (e.target === m) m.classList.remove("show"); }));

  // ---------- 初始化 ----------
  const BOOT_TIME = Date.now();
  // 启动期防护：WebView2 初始化可能合成鼠标事件（曾有残留光标位置触发误点击）
  function winClose() {
    if (Date.now() - BOOT_TIME < 2000) return;
    pywebview.api.close_window();
  }
  // 半透明窗口：悬停恢复不透明（操作按钮时永远清晰），移开恢复半透明
  document.addEventListener("mouseenter", () => {
    if (window.pywebview && pywebview.api) pywebview.api.set_main_alpha(1.0);
  });
  document.addEventListener("mouseleave", () => {
    if (window.pywebview && pywebview.api) pywebview.api.set_main_alpha(0.92);
  });
  window.addEventListener("pywebviewready", () => {
    pywebview.api.get_state().then(s => {
      applyState(s);
      outputOpen = !!s.output_open;
      if (!s.has_api_key) openSettings();
    });
  });
</script>
</body>
</html>
